[keys]
next_workspace = "alt+}"
previous_workspace = "alt+{"
next_tab = "alt+]"
previous_tab = "alt+["
new_tab = "alt+t"
close_pane = "alt+w"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+x"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "code-sessionizer"
width = "100%"
height = "50%"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "herdr-urls"
width = "100%"
height = "50%"

[[keys.command]]
key = "prefix+n"
type = "shell"
command = "sessionizer ~/notes"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "sessionizer ~/agent-memory"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "ai-workspaces"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
