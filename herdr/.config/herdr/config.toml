[theme]
name = "terminal"

# GitHub Dark Dimmed. Herdr has no theme registry, so the palette has to live
# here as token overrides.
[theme.custom]
panel_bg    = "#1c2128"
surface_dim = "#1c2128"
surface0    = "#22272e"
surface1    = "#2d333b"
overlay0    = "#444c56"
overlay1    = "#545d68"
text        = "#adbac7"
subtext0    = "#768390"
accent      = "#539bf5"
blue        = "#539bf5"
mauve       = "#b083f0"
green       = "#57ab5a"
yellow      = "#c69026"
red         = "#f47067"
teal        = "#39c5cf"
peach       = "#cc6b2c"

[keys]
next_workspace = "alt+}"
previous_workspace = "alt+{"
next_tab = "alt+]"
previous_tab = "alt+["
new_tab = "alt+t"
close_pane = "alt+w"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+x"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "code-sessionizer"
width = "100%"
height = "50%"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "herdr-urls"
width = "100%"
height = "50%"

[[keys.command]]
key = "prefix+n"
type = "shell"
command = "sessionizer ~/notes"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "sessionizer ~/agent-memory"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "ai-workspaces"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
