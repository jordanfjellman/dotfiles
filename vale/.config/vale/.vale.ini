# Global Vale configuration.
#
# Vale finds this at ~/.config/vale/.vale.ini and applies it to any file that
# isn't inside a project shipping its own .vale.ini, which wins instead. Pass
# --no-global to skip it entirely.
#
# Division of labour with harper-ls: Harper owns grammar, spelling, and
# mechanics. Vale owns style and readability. Neither is configured to check
# what the other checks, so a flagged line has exactly one owner.

StylesPath = styles

MinAlertLevel = suggestion

# Downloaded by `vale sync` into StylesPath. write-good carries the checks
# Hemingway is known for: passive voice, adverbs, weasel words, wordiness.
Packages = write-good

[*.md]
BasedOnStyles = write-good, Jordan

# write-good's E-Prime rule bans every form of "to be", which is a far stronger
# claim than "prefer the active voice" and fires on almost every sentence.
write-good.E-Prime = NO

# Per-document-type overrides. Vale applies sections in order, so a later
# section refines the base above rather than replacing it. This is where a
# document type that earns different limits gets them.

# READMEs are scanned, not read. Hold them to the tighter sentence limit.
[README.md]
Jordan.SentenceLength = error

# Documents an agent reads: AGENTS.md, CLAUDE.md, skills, subagent and command
# definitions. A different reader with different failure modes, so the rule set
# differs rather than just its thresholds.
#
# Sentence length and passive voice still earn their place: a step whose actor
# is implicit is a step that gets skipped. What changes is that an agent reads
# a prohibition as a suggestion of the forbidden thing, and reads an em dash as
# nothing at all.
#
# Both globs carry a `**/` prefix. Vale matches a section against the path as
# it was given, so a bare `[AGENTS.md]` matches only a file invoked at the repo
# root and silently misses `pi/.pi/agent/AGENTS.md`. `**/` matches zero or more
# leading segments, so it covers both.
[**/{AGENTS,CLAUDE,SKILL}.md]
BasedOnStyles = write-good, Jordan, Agents
Jordan.EmDash = NO
Jordan.Readability = NO

[**/{agents,commands,skills}/*.md]
BasedOnStyles = write-good, Jordan, Agents
Jordan.EmDash = NO
Jordan.Readability = NO
